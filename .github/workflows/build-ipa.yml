name: Build iOS IPA Package

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build Unsigned IPA for Sideloading
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare Web Assets for iOS
        run: |
          # [AUDIO-FIX] Kem theo toan bo giong Quang Minh ghi san (audio/quang_minh).
          # Thieu co nay app chi con giong TTS cua may doc thay -> sai giong.
          python3 tools/prepare_ios_assets.py --with-audio

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode Project
        run: |
          cd ios
          xcodegen generate

      - name: Build Xcode Archive (Unsigned)
        run: |
          cd ios
          xcodebuild -project Chip3D.xcodeproj \
                     -scheme Chip3D \
                     -configuration Release \
                     -destination 'generic/platform=iOS' \
                     -archivePath build/Chip3D.xcarchive \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     archive

      - name: Package into .IPA File
        run: |
          cd ios
          mkdir -p Payload
          cp -r build/Chip3D.xcarchive/Products/Applications/Chip3D.app Payload/
          zip -r -9 Chip3D.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chip3D-iOS-App
          path: ios/Chip3D.ipa
          retention-days: 14
